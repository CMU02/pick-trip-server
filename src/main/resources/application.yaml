spring:
  application:
    name: PickTrip

  profiles:
    active: dev
  config:
    import: optional:file:.env[.properties]
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

  security:
    oauth2:
      client:
        # 카카오는 구글과 달리 CommonOAuth2Provider 내장 항목이 아니므로 엔드포인트를 직접 정의한다.
        # 환경과 무관한 고정값이라 프로필별 파일이 아닌 여기에 둔다. client-id·secret 만 프로필에서 주입한다.
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
        registration:
          kakao:
            client-name: Kakao
            authorization-grant-type: authorization_code
            # 카카오 토큰 API 는 Basic 인증 헤더를 받지 않고 client_secret 을 본문으로 받는다.
            client-authentication-method: client_secret_post
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - profile_image
              - account_email

  jpa:
    hibernate:
      ddl-auto: create # 배포 시에는 Validate로 변경.
    properties:
      hibernate:
        show_sql: false
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

  # AI 일정 생성 (OpenAI). API 키는 .env 로 주입하며 Git 에 커밋하지 않는다.
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
          model: ${OPENAI_MODEL:gpt-5.1}
    # MCP 서버 (SSE/HTTP) — 프론트 팀원 AI 클라이언트에 read-only API 문서 제공
    mcp:
      server:
        name: picktrip-api-docs
        version: 1.0.0
        type: SYNC
        instructions: >-
          PickTrip 백엔드 REST API 문서를 read-only 로 제공합니다.
          listEndpoints / getEndpoint / searchEndpoints / getErrorContract 도구로
          엔드포인트 목록·상세 스키마·공통 에러 계약을 조회하세요.
        capabilities:
          tool: true