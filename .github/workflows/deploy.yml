name: Deploy to EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# 배포가 겹치면 컨테이너 교체 중 충돌하므로 직렬화한다.
concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/cmu02/pick-trip-server

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # AWS OIDC 역할 인수에 필요

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Gradle 실행 권한 부여
        run: chmod +x gradlew

      - name: 실행 가능 jar 빌드
        run: ./gradlew bootJar

      - name: Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 빌드 및 푸시 (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: 배포 전 필수 환경변수 키 목록 추출
        id: envkeys
        run: |
          # prod 설정이 요구하는 환경변수를 yaml 에서 직접 뽑는다. 별도 목록 파일을 두면 갱신을 잊는다.
          # 기본값이 붙은 형태(콜론 포함)는 누락돼도 기동되므로 패턴에 걸리지 않는다.
          keys=$(grep -oE '\$\{[A-Z0-9_]+\}' src/main/resources/application-prod.yaml | tr -d '${}' | sort -u | tr '\n' ' ')
          echo "keys=$keys" >> "$GITHUB_OUTPUT"

      # SSH(22) 대신 SSM Run Command 로 배포한다. 보안그룹은 80/443 만 열어 두고 SSH 키도 저장하지 않는다.
      # 역할은 infra/github-deploy-role.yaml 로 만들며, main 브랜치 실행만 인수할 수 있다.
      - name: AWS 자격 증명 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: EC2 배포 (SSM Run Command)
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          SHA: ${{ github.sha }}
          REQUIRED_KEYS: ${{ steps.envkeys.outputs.keys }}
        run: |
          set -euo pipefail

          # 원격 스크립트 앞에 배포 변수를 붙여 하나의 명령으로 보낸다.
          {
            echo "IMAGE='${IMAGE}'"
            echo "SHA='${SHA}'"
            echo "REQUIRED_KEYS='${REQUIRED_KEYS}'"
            cat .github/scripts/deploy-remote.sh
          } > "$RUNNER_TEMP/remote.sh"
          jq -n --rawfile s "$RUNNER_TEMP/remote.sh" \
            '{commands: [$s], executionTimeout: ["600"]}' > "$RUNNER_TEMP/params.json"

          CID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "pick-trip-server deploy ${SHA::7}" \
            --parameters "file://$RUNNER_TEMP/params.json" \
            --query Command.CommandId --output text)
          echo "SSM CommandId: $CID"

          # 원격 스크립트의 헬스체크(최대 3분)와 이미지 pull 시간을 감안해 최대 10분 기다린다.
          STATUS=Pending
          for i in $(seq 1 120); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) ;; *) break ;; esac
          done

          echo "----- 원격 출력 -----"
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          echo "----- 원격 오류 출력 -----"
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text
          echo "SSM 상태: $STATUS"
          [ "$STATUS" = "Success" ]
