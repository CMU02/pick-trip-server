name: Deploy to EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# 배포가 겹치면 컨테이너 교체 중 충돌하므로 직렬화한다.
concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/cmu02/pick-trip-server

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Gradle 실행 권한 부여
        run: chmod +x gradlew

      - name: 실행 가능 jar 빌드
        run: ./gradlew bootJar

      - name: Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 빌드 및 푸시 (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: EC2 배포
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE,GHCR_USER,GHCR_TOKEN,SHA
          script: |
            set -e
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull "$IMAGE:$SHA"

            docker rm -f picktrip 2>/dev/null || true
            # 8081 은 루프백에만 바인딩한다. 외부 노출은 nginx 가 담당하므로 보안그룹 변경이 필요 없다.
            docker run -d --name picktrip --restart unless-stopped \
              -p 127.0.0.1:8081:8080 \
              --memory=1g \
              --log-opt max-size=10m --log-opt max-file=3 \
              --env-file /opt/picktrip/.env \
              -e SPRING_PROFILES_ACTIVE=prod \
              "$IMAGE:$SHA"

            # 디스크가 여유롭지 않으므로 이전 태그 이미지를 정리한다.
            docker image prune -af

            for i in $(seq 1 36); do
              if curl -sf http://127.0.0.1:8081/actuator/health > /dev/null; then
                echo "헬스체크 통과"
                exit 0
              fi
              sleep 5
            done
            echo "헬스체크 실패 - 최근 로그"
            docker logs --tail 100 picktrip
            exit 1
